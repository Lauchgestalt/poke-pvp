name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  interface:
    name: interface (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci
        working-directory: interface
      - run: npm run check
        working-directory: interface
      - run: npm run lint
        working-directory: interface

  server:
    name: server (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node --check server.js
        working-directory: server

  lua:
    name: client.lua (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lunarmodules/luacheck@v1
        with:
          args: lua/client.lua
